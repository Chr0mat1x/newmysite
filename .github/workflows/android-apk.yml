name: Android APK

# The container this repo is developed in has no persistent Android toolchain,
# so the APK is built on a GitHub runner instead. The runner already ships the
# JDK and Android SDK, which keeps the build reproducible and the artifact
# downloadable from the run (and attachable to a release).
#
# Trigger: pushing a `v*` tag, or running it by hand from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Write online build env
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: |
          {
            echo "VITE_SUPABASE_URL=$SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "VITE_VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY"
          } > .env.online

      - name: Build web + sync Capacitor
        run: npm run android:sync

      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            && gh release upload "${GITHUB_REF_NAME}" android/app/build/outputs/apk/debug/app-debug.apk --clobber \
            || echo "no release for ${GITHUB_REF_NAME}; APK is on the run artifacts only"
